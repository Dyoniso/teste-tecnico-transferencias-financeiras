<div class="modal-backdrop">
  <section class="modal modal-small">
    <header class="modal-header">
      <div>
        <small>Conta</small>
        <h2>
          {{ account() ? 'Editar conta' : 'Nova conta' }}
        </h2>
      </div>

      <button type="button" class="icon-button" (click)="close.emit()">
        ×
      </button>
    </header>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-grid">
        <label class="field field-full">
          <span>Pessoa *</span>

          <select formControlName="personId">
            <option [ngValue]="0">Selecione uma pessoa</option>

            @for (person of persons(); track person.id) {
              <option [ngValue]="person.id">
                {{ person.name }}
              </option>
            }
          </select>
        </label>

        <label class="field">
          <span>Saldo inicial</span>
          <input
            type="number"
            min="0"
            step="0.01"
            formControlName="balance"
          />
        </label>

        <label class="field">
          <span>Cheque especial</span>
          <input
            type="number"
            min="0"
            step="0.01"
            formControlName="overdraftLimit"
          />
        </label>

        <label class="field field-full">
          <span>Status</span>

          <select formControlName="status">
            <option [ngValue]="status.Active">Ativa</option>
            <option [ngValue]="status.Blocked">Bloqueada</option>
            <option [ngValue]="status.Inactive">Inativa</option>
          </select>
        </label>
      </div>

      <footer class="modal-actions">
        <button type="button" class="button-secondary" (click)="close.emit()">
          Cancelar
        </button>

        <button type="submit" class="button-primary">
          Salvar conta
        </button>
      </footer>
    </form>
  </section>
</div>
